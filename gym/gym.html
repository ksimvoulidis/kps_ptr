<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL Tracker">
<title>PPL Tracker</title>
<style>
:root{--fs:15px;--bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;--txt:#fff;--txt2:rgba(235,235,245,.8);--txt3:rgba(235,235,245,.5);--sep:#38383a;--acc:#0a84ff;--red:#ff453a;--grn:#30d158;--org:#ff9f0a;--pur:#bf5af2;--tel:#5ac8fa;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;font-size:var(--fs);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
.scr{display:none;flex:1;overflow-y:auto;padding-bottom:calc(68px + var(--safe))}
.scr.on{display:block}
#nav{position:fixed;bottom:0;left:0;right:0;background:rgba(28,28,30,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--sep);display:flex;padding-bottom:var(--safe);z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 10px;border:none;background:none;color:var(--txt3);font-size:.6em;gap:3px;cursor:pointer;font-family:inherit}
.nb.on{color:var(--acc)}
.nb .ic{font-size:1.8em}
.ph{padding:52px 16px 12px}
.pt{font-size:2em;font-weight:700;letter-spacing:-.5px}
.ps{font-size:.87em;color:var(--txt3);margin-top:4px}
.card{background:var(--bg2);border-radius:16px;margin:0 14px 10px;overflow:hidden}
.btn{border:none;border-radius:14px;padding:13px 20px;font-size:inherit;font-weight:700;cursor:pointer;font-family:inherit}
.btn-pri{background:var(--acc);color:#fff}
.btn-full{width:100%;display:block}
.btn-grn{background:var(--grn);color:#fff}
.btn-ghost{background:var(--bg3);color:var(--txt)}
.btn-red{background:rgba(255,69,58,.15);color:var(--red)}
.btn:disabled{background:var(--bg3);color:var(--txt3);cursor:default;opacity:.5}
.bdg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.75em;font-weight:700}
.prog-ring{display:flex;gap:4px;margin-bottom:14px}
.prog-seg{flex:1;height:4px;border-radius:2px}
.tabs{display:flex;gap:8px;padding:0 14px 12px}
.tab-btn{flex:1;padding:10px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:inherit;font-family:inherit}
/* workout */
.wh{background:var(--bg2);padding:52px 16px 14px;position:sticky;top:0;z-index:10}
.exc{margin:10px 14px;background:var(--bg2);border-radius:16px;overflow:hidden;border:1px solid var(--sep);transition:border-color .3s}
.exc.done-all{border-color:rgba(48,209,88,.4)}
.exc-hdr{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.exc-chevron{color:var(--txt3);font-size:1.2em;transition:transform .25s;display:inline-block;margin-left:8px}
.exc-body{display:none;border-top:1px solid var(--sep)}
.exc-body.open{display:block}
.ex-tip{padding:8px 14px;background:rgba(10,132,255,.08);color:var(--tel);font-size:.82em;border-bottom:1px solid var(--sep)}
.prev-best{padding:5px 14px;font-size:.78em;color:var(--txt3);border-bottom:1px solid var(--sep)}
.set-row{display:flex;align-items:center;padding:10px 14px;gap:10px;border-top:1px solid var(--sep)}
.sn{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;color:var(--txt3);flex-shrink:0;transition:background .2s,color .2s}
.sn.done{background:var(--grn);color:#fff}
.set-inputs{display:flex;gap:8px;flex:1}
.set-ig{flex:1}
.set-lbl{font-size:.7em;color:var(--txt3);text-transform:uppercase;margin-bottom:2px}
.set-inp{width:100%;background:var(--bg3);border:none;border-radius:8px;padding:8px;color:var(--txt);font-size:inherit;font-weight:600;text-align:center;font-family:inherit}
.set-inp:focus{outline:none;background:var(--bg4)}
.sc{width:38px;height:38px;border-radius:50%;border:2px solid var(--bg4);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:1.1em;transition:background .2s,border-color .2s,color .2s;color:transparent}
.sc.done{background:var(--grn);border-color:var(--grn);color:#fff}
/* timer */
#timer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#timer.on{display:flex}
.tmr-wrap{position:relative;width:220px;height:220px}
.tmr-svg{transform:rotate(-90deg)}
.tmr-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tmr-num{font-size:3.5em;font-weight:200;letter-spacing:-2px}
.tmr-btns{display:flex;gap:14px}
/* history */
.hist-item{margin:0 14px 10px;background:var(--bg2);border-radius:16px;overflow:hidden}
.hist-det{display:none;border-top:1px solid var(--sep);padding:12px 16px}
.hist-det.open{display:block}
/* calendar */
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--grn);margin-top:2px}
/* program editor */
.prog-ex{margin:0 14px 8px;background:var(--bg2);border-radius:14px;overflow:hidden}
.prog-ex-edit{display:none;border-top:1px solid var(--sep);padding:14px 12px}
.prog-ex-edit.open{display:block}
.edit-lbl{font-size:.75em;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.edit-inp{width:100%;background:var(--bg3);border:none;border-radius:10px;padding:9px 11px;color:var(--txt);font-size:inherit;font-family:inherit}
.edit-inp:focus{outline:none;background:var(--bg4)}
.edit-ta{height:70px;resize:none}
.edit-row{display:flex;gap:8px;margin-bottom:10px}
.edit-row .ef{flex:1}
.re-btn{background:none;border:none;cursor:pointer;font-size:1em;padding:2px 6px;line-height:1;font-family:inherit;color:var(--txt3)}
.re-btn:disabled{color:var(--bg4);cursor:default}
/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;align-items:flex-end}
#modal.on{display:flex}
.modal-sheet{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 16px;padding-bottom:calc(20px + var(--safe));width:100%}
.m-title{text-align:center;font-weight:700;font-size:1.1em;margin-bottom:8px}
.m-msg{text-align:center;color:var(--txt3);font-size:.88em;margin-bottom:16px}
.m-btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:inherit;font-weight:600;cursor:pointer;margin-bottom:8px;display:block;font-family:inherit;text-align:center}
/* settings */
.sett-sec{margin:0 14px 16px}
.sett-title{font-size:.78em;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;padding:0 4px 8px}
.sett-card{background:var(--bg2);border-radius:16px;overflow:hidden}
.sett-row{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--sep);cursor:pointer}
.sett-row:last-child{border-bottom:none}
.fs-pick{display:flex;gap:8px}
.fs-btn{flex:1;border:none;border-radius:10px;padding:8px 4px;cursor:pointer;font-weight:700;font-family:inherit}
/* toast */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(48,209,88,.92);color:#fff;padding:10px 20px;border-radius:20px;font-size:.88em;font-weight:700;z-index:500;display:none;white-space:nowrap;pointer-events:none}
#toast.on{display:block}
.empty{text-align:center;padding:60px 30px;color:var(--txt3)}
</style>
</head>
<body>
<div id="app">
  <div id="scr-home"     class="scr on"></div>
  <div id="scr-workout"  class="scr">
    <div class="wh">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div id="wh-name" style="font-weight:700;font-size:1.2em"></div>
          <div id="wh-week" style="color:var(--txt3);font-size:.85em;margin-top:2px"></div>
        </div>
        <button class="btn btn-ghost" style="width:32px;height:32px;padding:0;border-radius:50%;font-size:1.1em" onclick="closeWorkout()">✕</button>
      </div>
    </div>
    <div id="workout-body"></div>
  </div>
  <div id="scr-history"  class="scr">
    <div class="ph"><div class="pt">Ιστορικό</div><div class="ps" id="hist-count"></div></div>
    <div class="tabs">
      <button id="htab-list" class="tab-btn" onclick="setHistTab('list')">📋 Λίστα</button>
      <button id="htab-cal"  class="tab-btn" onclick="setHistTab('cal')">📅 Ημερολόγιο</button>
    </div>
    <div id="hist-list"></div>
    <div id="hist-cal" style="display:none"></div>
  </div>
  <div id="scr-program"  class="scr">
    <div class="ph"><div class="pt">Πρόγραμμα</div><div class="ps">Επεξεργασία & Αναδιάταξη</div></div>
    <div class="tabs">
      <button id="ptab-push" class="tab-btn" onclick="setProgTab('push')">💪 PUSH</button>
      <button id="ptab-pull" class="tab-btn" onclick="setProgTab('pull')">🏋️ PULL</button>
      <button id="ptab-legs" class="tab-btn" onclick="setProgTab('legs')">🦵 LEGS</button>
    </div>
    <div id="prog-body"></div>
  </div>
  <div id="scr-settings" class="scr">
    <div class="ph"><div class="pt">Ρυθμίσεις</div></div>
    <div id="settings-body"></div>
  </div>
  <div id="nav">
    <button class="nb on"  id="nb-home"     onclick="goTo('home')">    <span class="ic">🏠</span><span>Σήμερα</span></button>
    <button class="nb"     id="nb-workout"  onclick="startWorkout()">  <span class="ic">🏋️</span><span>Εκκίνηση</span></button>
    <button class="nb"     id="nb-history"  onclick="goTo('history')"> <span class="ic">📋</span><span>Ιστορικό</span></button>
    <button class="nb"     id="nb-program"  onclick="goTo('program')"> <span class="ic">📝</span><span>Πρόγραμμα</span></button>
    <button class="nb"     id="nb-settings" onclick="goTo('settings')"><span class="ic">⚙️</span><span>Ρυθμίσεις</span></button>
  </div>
</div>

<div id="timer">
  <div id="tmr-next" style="font-size:.88em;color:var(--txt3);text-align:center;max-width:260px;padding:0 20px"></div>
  <div class="tmr-wrap">
    <svg class="tmr-svg" width="220" height="220" viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="100" fill="none" stroke="var(--bg3)" stroke-width="10"/>
      <circle id="tmr-ring" cx="110" cy="110" r="100" fill="none" stroke="var(--acc)" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="628.3" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear"/>
    </svg>
    <div class="tmr-txt">
      <div id="tmr-disp" class="tmr-num">2:00</div>
      <div style="font-size:.88em;color:var(--txt3)">ανάπαυση</div>
    </div>
  </div>
  <div class="tmr-btns">
    <button class="btn btn-ghost" style="color:var(--acc)" onclick="timerAdd(30)">+30"</button>
    <button class="btn btn-ghost" onclick="timerSkip()">Παράλειψη ›</button>
  </div>
</div>

<div id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-sheet" id="modal-inner"></div>
</div>
<div id="toast"></div>
<input id="file-in" type="file" accept=".json" style="display:none">

<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
var DEF = {
  push:{name:'PUSH',color:'#ff453a',icon:'💪',exercises:[
    {id:'p1',name:'Bench Press',        s1:'5×3-5',   s2:'4×8-10', s3:'4×4-5',   s4:'2×8',    r1:210,r2:150,r3:180,r4:90, tip:'Κατέβαση 2-3\'\'. Ώμοι πίσω & κάτω. Εβδ.2: tempo 3-1-2.'},
    {id:'p2',name:'Incline DB Press',   s1:'4×5',     s2:'3×10-12',s3:'4×6',     s4:'2×10',   r1:150,r2:120,r3:150,r4:90, tip:'Γωνία 30°. Ελεγχόμενη κάθοδος. Αισθάνεσαι το στήθος.'},
    {id:'p3',name:'Cable Chest Fly',    s1:'—',       s2:'3×12-15',s3:'3×12',    s4:'2×12',   r1:0,  r2:90, r3:90, r4:90, tip:'Χαμηλό βάρος, πλήρης τόξο. Squeeze στην κορυφή.'},
    {id:'p4',name:'Overhead Press',     s1:'4×4-5',   s2:'3×8-10', s3:'4×5',     s4:'2×8',    r1:180,r2:150,r3:180,r4:120,tip:'Πίεσε ίσια πάνω. Μη ξεκουράς τη μπάρα μεταξύ reps.'},
    {id:'p5',name:'Lateral Raise',      s1:'3×10',    s2:'3×15',   s3:'3×12',    s4:'2×15',   r1:90, r2:90, r3:90, r4:60, tip:'Ελαφρύ βάρος πάντα. Αγκώνας ελαφρά λυγιστός.'},
    {id:'p6',name:'Tricep Pushdown',    s1:'3×8',     s2:'3×12-15',s3:'3×10',    s4:'2×12',   r1:90, r2:90, r3:90, r4:60, tip:'Rope: άνοιγμα στο κάτω σημείο. Αγκώνες σταθεροί.'},
    {id:'p7',name:'Close-grip Bench',   s1:'3×5-6',   s2:'3×10-12',s3:'3×6-8',   s4:'—',      r1:120,r2:90, r3:120,r4:0,  tip:'Εναλλακτικά Dips αν δεν ενοχλεί τον ώμο.'}
  ]},
  pull:{name:'PULL',color:'#30d158',icon:'🏋️',exercises:[
    {id:'pl1',name:'Deadlift',           s1:'4×3-4',   s2:'3×6-8',  s3:'4×4-5',   s4:'2×5',    r1:240,r2:180,r3:210,r4:120,tip:'Ουδέτερη σπονδυλική. Πρόβλημα πλάτης → Romanian DL.'},
    {id:'pl2',name:'Pull-up / Lat Pull', s1:'4×4-5',   s2:'3×8-10', s3:'4×5-6',   s4:'2×8',    r1:180,r2:120,r3:150,r4:90, tip:'Pull-ups: πρόσθεσε βάρος (belt). Lat: τράβα προς στήθος.'},
    {id:'pl3',name:'Barbell Row',        s1:'4×4-5',   s2:'3×8-10', s3:'4×5',     s4:'2×8',    r1:180,r2:150,r3:180,r4:120,tip:'Τράβα στον αφαλό. Ωμοπλάτες μαζί στο τέλος.'},
    {id:'pl4',name:'Seated Cable Row',   s1:'3×6-8',   s2:'3×10-12',s3:'3×8',     s4:'2×12',   r1:120,r2:90, r3:120,r4:60, tip:'Squeeze ωμοπλάτες. Μη γέρνεις υπερβολικά πίσω.'},
    {id:'pl5',name:'Face Pull',          s1:'3×12',    s2:'3×15',   s3:'3×12',    s4:'2×15',   r1:90, r2:90, r3:90, r4:60, tip:'Υγεία ώμων — κάνε το ΠΑΝΤΑ. Αγκώνες ψηλά.'},
    {id:'pl6',name:'Barbell Curl',       s1:'3×5-6',   s2:'3×10-12',s3:'3×6-8',   s4:'2×10',   r1:90, r2:90, r3:90, r4:60, tip:'Αργή κατέβαση (3\'\'). Μη ταλαντεύεσαι.'},
    {id:'pl7',name:'Hammer Curl',        s1:'—',       s2:'3×12',   s3:'2×10',    s4:'—',      r1:0,  r2:90, r3:90, r4:0,  tip:'Ουδέτερη λαβή. Ελαφρύ βάρος, πλήρης εύρος.'}
  ]},
  legs:{name:'LEGS',color:'#bf5af2',icon:'🦵',exercises:[
    {id:'l1',name:'Squat',               s1:'5×3-4',   s2:'4×8-10', s3:'4×4-5',   s4:'2×6',    r1:240,r2:180,r3:210,r4:120,tip:'Εβδ.2: tempo 3-1-2. Γόνατα ευθεία με δάχτυλα.'},
    {id:'l2',name:'Romanian Deadlift',   s1:'4×5',     s2:'3×10-12',s3:'4×6',     s4:'2×8',    r1:180,r2:120,r3:150,r4:90, tip:'Αίσθηση stretch πίσω από γόνατα. Πλάτη ίσια.'},
    {id:'l3',name:'Leg Press',           s1:'4×6-8',   s2:'3×12-15',s3:'4×8',     s4:'2×12',   r1:150,r2:120,r3:150,r4:90, tip:'Πόδια ψηλά = γλουτοί. Χαμηλά = τετρακέφαλοι.'},
    {id:'l4',name:'Leg Curl',            s1:'3×8',     s2:'3×12-15',s3:'3×10',    s4:'2×12',   r1:90, r2:90, r3:90, r4:60, tip:'Αργή κατέβαση (3\'\'). Ισορροπία = προστασία γονάτων.'},
    {id:'l5',name:'Bulgarian Split Sq.', s1:'3×5/πλ.', s2:'3×10/πλ.',s3:'3×6/πλ.',s4:'—',     r1:120,r2:90, r3:120,r4:0,  tip:'Αν ενοχλεί το γόνατο: Walking Lunge.'},
    {id:'l6',name:'Calf Raise',          s1:'4×8',     s2:'4×15-20',s3:'4×10',    s4:'2×15',   r1:60, r2:60, r3:60, r4:60, tip:'Πλήρης εύρος — μέχρι κάτω αργά.'},
    {id:'l7',name:'Plank + Ab Wheel',    s1:'3×30"',   s2:'3×45"',  s3:'3×45"',   s4:'2×30"',  r1:60, r2:60, r3:60, r4:60, tip:'Core = σταθεροποιητής για όλες τις βαριές ασκήσεις.'}
  ]}
};
var WK=[{l:'Εβδ.1 — ΔΥΝΑΜΗ',c:'#ff453a'},{l:'Εβδ.2 — ΥΠΕΡΤΡΟΦΙΑ',c:'#30d158'},{l:'Εβδ.3 — ΔΥΝΑΜΗ+',c:'#bf5af2'},{l:'Εβδ.4 — ΑΠΟΦΟΡΤΙΣΗ',c:'#5ac8fa'}];
var SO=['push','pull','legs'];
var FS={sm:'13px',md:'15px',lg:'17px',xl:'20px'};

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
var DB=null,DB_READY=false,DB_NAME='ppl-tracker-db',DB_STORE='kv',DB_KEY='ppl5',SAVE_CHAIN=Promise.resolve(),STORAGE_MODE='IndexedDB';
function defState(){return{cw:1,si:0,total:0,prog:JSON.parse(JSON.stringify(DEF)),logs:[],active:null,fs:'md'}}
function normST(d){
  var b=defState();d=d||{};
  return{cw:d.cw||b.cw,si:d.si!==undefined?d.si:b.si,total:d.total||0,prog:d.prog||b.prog,logs:Array.isArray(d.logs)?d.logs:b.logs,active:d.active||null,fs:d.fs||b.fs};
}
function openDB(){
  return new Promise(function(res,rej){
    if(!('indexedDB' in window))return rej(new Error('IndexedDB not supported'));
    var q=indexedDB.open(DB_NAME,1);
    q.onupgradeneeded=function(){var db=q.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};
    q.onsuccess=function(){res(q.result)};
    q.onerror=function(){rej(q.error||new Error('IndexedDB open failed'))};
  });
}
function idbGet(k){
  return new Promise(function(res,rej){
    var tx=DB.transaction(DB_STORE,'readonly'),st=tx.objectStore(DB_STORE),q=st.get(k);
    q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)};
  });
}
function idbSet(k,v){
  return new Promise(function(res,rej){
    var tx=DB.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(v,k);
    tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)};
  });
}
function loadST(){
  return openDB().then(function(db){
    DB=db;DB_READY=true;STORAGE_MODE='IndexedDB';
    return idbGet(DB_KEY).then(function(d){
      if(d)return normST(d);
      var legacy=null;
      try{legacy=localStorage.getItem('ppl5')}catch(e){}
      if(legacy){
        try{
          var st=normST(JSON.parse(legacy));
          return idbSet(DB_KEY,st).then(function(){
            try{localStorage.removeItem('ppl5')}catch(e){}
            return st;
          });
        }catch(e){}
      }
      return defState();
    });
  }).catch(function(e){
    console.warn('IndexedDB unavailable, using localStorage fallback',e);
    STORAGE_MODE='localStorage fallback';
    try{var d=localStorage.getItem('ppl5');return d?normST(JSON.parse(d)):defState()}catch(e2){return defState()}
  });
}
function saveST(){
  try{
    var snap=JSON.parse(JSON.stringify(ST));
    if(DB_READY&&DB){
      SAVE_CHAIN=SAVE_CHAIN.then(function(){return idbSet(DB_KEY,snap)}).catch(function(e){
        console.warn('IndexedDB save failed, using localStorage fallback',e);
        STORAGE_MODE='localStorage fallback';
        try{localStorage.setItem('ppl5',JSON.stringify(snap))}catch(e2){}
      });
    }else localStorage.setItem('ppl5',JSON.stringify(snap));
  }catch(e){}
}
function requestPersistentStorage(){
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
}

// HELPERS
// ═══════════════════════════════════════════
function sk(w){return 's'+w} function rk(w){return 'r'+w}
function psc(s){if(!s||s==='—')return 0;var m=s.match(/^(\d+)/);return m?+m[1]:3}
function fdate(iso){return new Date(iso).toLocaleDateString('el-GR',{weekday:'short',day:'numeric',month:'short'})}
function calcVol(log){return log.ex.reduce(function(s,e){return s+e.sets.reduce(function(ss,st){return ss+(st.done?(+st.w||0)*(+st.r||0):0)},0)},0)}
function bestFor(exId){for(var i=ST.logs.length-1;i>=0;i--){var e=ST.logs[i].ex.find(function(x){return x.id===exId});if(e){var d=e.sets.filter(function(s){return s.done&&+s.w>0});if(d.length){var b=d.reduce(function(a,c){return+c.w>+a.w?c:a},d[0]);return'📈 Καλύτερο: '+b.w+'kg×'+b.r}}}return null}
function bdg(txt,col){return'<span class="bdg" style="background:'+col+'33;color:'+col+'">'+txt+'</span>'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function applyFs(){document.documentElement.style.setProperty('--fs',FS[ST.fs]||'15px')}

        '<span style="background:rgba(255,255,255,.12);border-radius:20px;padding:3px 10px;font-size:.8em;font-weight:600">🏆 #'+(ST.total+1)+'</span>'+

      '<button class="btn btn-pri btn-full" onclick="startWorkout()">Ξεκίνα Τώρα</button>'+
    '</div>'+
    (recent.length?'<div style="padding:4px 18px 8px;font-size:.72em;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px">Πρόσφατα</div>'+rec:'')+

// ═══════════════════════════════════════════
// WORKOUT  — DOM patch, no full re-render
// ═══════════════════════════════════════════
function startWorkout(){
  if(ST.active){activateWorkoutScr();return}
  var w=ST.cw,idx=ST.si,sk2=SO[idx],sess=ST.prog[sk2];
  ST.active={id:Date.now(),date:new Date().toISOString(),sk:sk2,sn:sess.name,cw:w,
    ex:sess.exercises.filter(function(e){return e[sk(w)]&&e[sk(w)]!=='—'}).map(function(e){
      return{id:e.id,name:e.name,presc:e[sk(w)],rest:e[rk(w)]||120,tip:e.tip||'',
        sets:Array.from({length:psc(e[sk(w)])},function(){return{w:'',r:'',done:false}})};
    })};
  saveST();
  buildWorkoutDOM();
  activateWorkoutScr();
}

function activateWorkoutScr(){
  var aw=ST.active,wi=WK[aw.cw-1];
  document.getElementById('wh-name').textContent=aw.sn;
  document.getElementById('wh-week').textContent=wi.l;
  document.querySelectorAll('.scr').forEach(function(x){x.classList.remove('on')});
  document.querySelectorAll('.nb').forEach(function(x){x.classList.remove('on')});
  document.getElementById('scr-workout').classList.add('on');
  document.getElementById('nb-workout').classList.add('on');
  curScr='workout';
}

// Build workout DOM once — never rebuild on set toggle
function buildWorkoutDOM(){
  var aw=ST.active;
  var html=aw.ex.map(function(ex,ei){
    var bst=bestFor(ex.id);
    var sets=ex.sets.map(function(s,si){
      return'<div class="set-row">'+
        '<div class="sn'+(s.done?' done':'')+'" id="sn-'+ei+'-'+si+'">'+(si+1)+'</div>'+
        '<div class="set-inputs">'+
          '<div class="set-ig"><div class="set-lbl">kg</div>'+
            '<input class="set-inp" type="number" inputmode="decimal" value="'+esc(s.w)+'" placeholder="0" oninput="inputW('+ei+','+si+',this.value)"></div>'+
          '<div class="set-ig"><div class="set-lbl">reps</div>'+
            '<input class="set-inp" type="number" inputmode="numeric" value="'+esc(s.r)+'" placeholder="0" oninput="inputR('+ei+','+si+',this.value)"></div>'+
        '</div>'+
        '<div class="sc'+(s.done?' done':'')+'" id="sc-'+ei+'-'+si+'" onclick="toggleSet('+ei+','+si+')">'+(s.done?'✓':'')+'</div>'+
      '</div>';
    }).join('');
    return'<div class="exc" id="exc-'+ei+'">'+
      '<div class="exc-hdr" onclick="toggleExHdr('+ei+')">'+
        '<div>'+
          '<div style="font-weight:700" id="ex-title-'+ei+'">'+esc(ex.name)+'</div>'+
          '<div style="color:var(--txt3);font-size:.82em;margin-top:2px">'+esc(ex.presc)+'</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:6px">'+
          '<span id="ex-badge-'+ei+'" style="display:none;background:rgba(48,209,88,.2);color:var(--grn);border-radius:20px;padding:1px 8px;font-size:.75em;font-weight:700">✓ Έγινε</span>'+
          '<span class="exc-chevron" id="chev-'+ei+'">⌄</span>'+
        '</div>'+
      '</div>'+
      '<div class="exc-body" id="exc-body-'+ei+'">'+
        (ex.tip?'<div class="ex-tip">💡 '+esc(ex.tip)+'</div>':'')+
        (bst?'<div class="prev-best">'+esc(bst)+'</div>':'')+
        sets+
      '</div>'+
    '</div>';
  }).join('');
  html+='<div style="padding:10px 14px 4px"><button class="btn btn-full" id="finish-btn" onclick="finishWorkout()"></button></div><div style="height:20px"></div>';
  document.getElementById('workout-body').innerHTML=html;
  updateFinishBtn();
  // Open first exercise by default
  var body0=document.getElementById('exc-body-0');
  var chev0=document.getElementById('chev-0');
  if(body0){body0.classList.add('open');if(chev0)chev0.style.transform='rotate(180deg)'}
}

function toggleExHdr(ei){
  var body=document.getElementById('exc-body-'+ei);
  var chev=document.getElementById('chev-'+ei);
  if(!body)return;
  var open=body.classList.toggle('open');
  if(chev)chev.style.transform=open?'rotate(180deg)':'rotate(0deg)';
}

// Patch only changed DOM nodes — no collapse
function toggleSet(ei,si){
  if(!ST.active)return;
  var s=ST.active.ex[ei].sets[si];
  s.done=!s.done;
  saveST(); // auto-save every toggle

  // Patch set-num circle
  var snEl=document.getElementById('sn-'+ei+'-'+si);
  if(snEl){snEl.className='sn'+(s.done?' done':'');}

  // Patch checkmark button
  var scEl=document.getElementById('sc-'+ei+'-'+si);
  if(scEl){scEl.className='sc'+(s.done?' done':'');scEl.textContent=s.done?'✓':'';}

  // Patch exercise done badge
  var ex=ST.active.ex[ei];
  var exDone=ex.sets.every(function(s2){return s2.done});
  var excEl=document.getElementById('exc-'+ei);
  if(excEl){excEl.className='exc'+(exDone?' done-all':'');}
  var badgeEl=document.getElementById('ex-badge-'+ei);
  if(badgeEl)badgeEl.style.display=exDone?'':'none';

  // Patch finish button
  updateFinishBtn();

  // Start rest timer
  if(s.done){
    var nxt=ex.sets[si+1],nxte=ST.active.ex[ei+1];
    var lbl=nxt?'Επόμενο set: '+ex.name:nxte?'Επόμενη: '+nxte.name:'Τελευταίο set! 🎉';
    startTimer(ex.rest||120,lbl);
  }
}

function updateFinishBtn(){
  var btn=document.getElementById('finish-btn');if(!btn||!ST.active)return;
  var allDone=ST.active.ex.every(function(e){return e.sets.every(function(s){return s.done})});
  btn.className='btn btn-full '+(allDone?'btn-grn':'btn-ghost');
  btn.style.color=allDone?'#fff':'var(--txt3)';
  btn.textContent=allDone?'🎉 Ολοκλήρωσε Προπόνηση':'Ολοκλήρωσε (σημείωσε όλα τα sets)';
}

function inputW(ei,si,v){if(!ST.active)return;ST.active.ex[ei].sets[si].w=v;saveST()}
function inputR(ei,si,v){if(!ST.active)return;ST.active.ex[ei].sets[si].r=v;saveST()}

function doSaveWorkout(){
  ST.logs.push(JSON.parse(JSON.stringify(ST.active)));
  ST.total++;
  var ns=ST.si+1,nw=ST.cw;
  if(ns>=SO.length){ns=0;nw=nw>=4?1:nw+1}
  ST.si=ns;ST.cw=nw;ST.active=null;
  saveST();stopTimer();goTo('home');showToast('Αποθηκεύτηκε! 🎉');
}
function finishWorkout(){
  if(!ST.active)return;
  var allDone=ST.active.ex.every(function(e){return e.sets.every(function(s){return s.done})});
  if(!allDone){showModal('Ολοκλήρωση;','Δεν έχουν σημειωθεί όλα τα sets.',[{l:'Αποθήκευση ούτως ή άλλως',pri:true,fn:doSaveWorkout}]);}
  else{doSaveWorkout()}
}
function closeWorkout(){
  showModal('Κλείσιμο;','Τα sets που έχεις σημειώσει είναι ήδη αποθηκευμένα αυτόματα.',[
    {l:'Κλείσιμο',fn:function(){stopTimer();goTo('home')}},
    {l:'Αποθήκευση & Κλείσιμο',pri:true,fn:doSaveWorkout}
  ]);
}

var tmrIv=null,tmrTotal=120,tmrLeft=0;

  document.getElementById('tmr-next').textContent=lbl;
  document.getElementById('timer').classList.add('on');
  updTimer();
  tmrIv=setInterval(function(){if(--tmrLeft<=0){stopTimer();return}updTimer()},1000);
}
function updTimer(){
  var m=Math.floor(tmrLeft/60),s=tmrLeft%60;
  document.getElementById('tmr-disp').textContent=m+':'+(s<10?'0':'')+s;
  document.getElementById('tmr-ring').style.strokeDashoffset=628.3-(628.3*tmrLeft/tmrTotal);
}
function stopTimer(){if(tmrIv){clearInterval(tmrIv);tmrIv=null}document.getElementById('timer').classList.remove('on')}
function timerSkip(){stopTimer()}

    '<button class="btn btn-ghost" style="padding:8px 14px" onclick="calNav(1)">›</button></div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 14px;margin-bottom:6px">'+DNS.map(function(d){return'<div style="text-align:center;font-size:.75em;color:var(--txt3);font-weight:600;padding:4px 0">'+d+'</div>'}).join('')+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 14px">'+grid+'</div>'+
    detail+'<div style="height:10px"></div>';
}
function calClick(k){calSel=calSel===k?null:k;renderCal()}
function calNav(d){calM+=d;if(calM>11){calM=0;calY++}else if(calM<0){calM=11;calY--}calSel=null;renderCal()}

// ═══════════════════════════════════════════
// PROGRAM EDITOR
// ═══════════════════════════════════════════
var progTab='push';
function setProgTab(t){
  progTab=t;
  SO.forEach(function(s){
    var btn=document.getElementById('ptab-'+s),sess=ST.prog[s];
    btn.style.background=s===t?sess.color+'33':'var(--bg3)';
    btn.style.color=s===t?sess.color:'var(--txt3)';
  });
  renderProg();
}
function renderProg(){
  var sess=ST.prog[progTab];
  var html=sess.exercises.map(function(ex,i){
    var first=i===0,last=i===sess.exercises.length-1;
    return'<div class="prog-ex">'+
      '<div style="display:flex;align-items:center;padding:12px 12px;gap:10px">'+
        '<div style="display:flex;flex-direction:column;gap:2px">'+
          '<button class="re-btn" '+(first?'disabled':'')+' onclick="reorder(\''+progTab+'\','+i+','+(i-1)+')">▲</button>'+
          '<button class="re-btn" '+(last?'disabled':'')+' onclick="reorder(\''+progTab+'\','+i+','+(i+1)+')">▼</button>'+
        '</div>'+
        '<div style="flex:1;cursor:pointer" onclick="togglePEx('+i+')">'+
          '<div style="font-weight:700">'+esc(ex.name)+'</div>'+
          '<div style="font-size:.78em;color:var(--txt3);margin-top:2px">'+esc(ex.s1)+' | '+esc(ex.s2)+' | '+esc(ex.s3)+' | '+esc(ex.s4)+'</div>'+
        '</div>'+
        '<button onclick="togglePEx('+i+')" style="background:none;border:none;color:var(--txt3);font-size:1.3em;cursor:pointer;padding:0 4px">›</button>'+
      '</div>'+
      '<div class="prog-ex-edit" id="pex-'+i+'">'+
        '<div style="margin-bottom:10px"><div class="edit-lbl">Όνομα</div><input class="edit-inp" id="en-'+i+'" value="'+esc(ex.name)+'"></div>'+
        [['1','Εβδ.1 (Δύναμη)'],['2','Εβδ.2 (Υπερτρ.)'],['3','Εβδ.3 (Δύν.+)'],['4','Εβδ.4 (Αποφ.)']].map(function(p){
          return'<div class="edit-row"><div class="ef"><div class="edit-lbl">Sets '+p[1]+'</div><input class="edit-inp" id="ew'+p[0]+'-'+i+'" value="'+esc(ex['s'+p[0]])+'"></div><div class="ef"><div class="edit-lbl">Ανάπ.(δ.)</div><input class="edit-inp" type="number" id="er'+p[0]+'-'+i+'" value="'+esc(ex['r'+p[0]])+'"></div></div>';
        }).join('')+
        '<div style="margin-bottom:12px"><div class="edit-lbl">Tip</div><textarea class="edit-inp edit-ta" id="et-'+i+'">'+esc(ex.tip||'')+'</textarea></div>'+
        '<div style="display:flex;gap:10px">'+
          '<button class="btn btn-pri" onclick="saveEx('+i+')">Αποθήκευση</button>'+
          '<button class="btn btn-red" onclick="delEx('+i+')">Διαγραφή</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
  html+='<button onclick="addEx(\''+progTab+'\')" style="width:calc(100% - 28px);margin:0 14px 12px;background:rgba(10,132,255,.1);color:var(--acc);border:2px dashed rgba(10,132,255,.3);border-radius:12px;padding:13px;font-size:inherit;font-weight:700;cursor:pointer;font-family:inherit">+ Νέα Άσκηση</button><div style="height:10px"></div>';
  document.getElementById('prog-body').innerHTML=html;
}
function togglePEx(i){document.getElementById('pex-'+i).classList.toggle('open')}
function saveEx(i){
  var ex=ST.prog[progTab].exercises[i];
  ex.name=document.getElementById('en-'+i).value;
  ['1','2','3','4'].forEach(function(w){ex['s'+w]=document.getElementById('ew'+w+'-'+i).value;ex['r'+w]=+document.getElementById('er'+w+'-'+i).value||90});
  ex.tip=document.getElementById('et-'+i).value;
  saveST();showToast('Αποθηκεύτηκε ✓');renderProg();
}
function delEx(i){
  showModal('Διαγραφή;','"'+ST.prog[progTab].exercises[i].name+'"',[
    {l:'Διαγραφή',red:true,fn:function(){ST.prog[progTab].exercises.splice(i,1);saveST();renderProg()}}
  ]);
}
function addEx(tab){
  ST.prog[tab].exercises.push({id:'x'+Date.now(),name:'Νέα Άσκηση',s1:'3×5',s2:'3×10',s3:'3×6',s4:'2×8',r1:120,r2:90,r3:120,r4:60,tip:''});
  saveST();renderProg();
  var last=ST.prog[tab].exercises.length-1;
  setTimeout(function(){var el=document.getElementById('pex-'+last);if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth'})}},80);
}
function reorder(tab,from,to){
  if(to<0||to>=ST.prog[tab].exercises.length)return;
  var ex=ST.prog[tab].exercises,item=ex.splice(from,1)[0];ex.splice(to,0,item);
  saveST();renderProg();
}

// ═══════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════
function renderSettings(){
  var fsBtns=['sm','md','lg','xl'].map(function(s){
    var lbl={sm:'Μικρό',md:'Κανον.',lg:'Μεγάλο',xl:'Πολύ Μεγ.'}[s],on=ST.fs===s;
    return'<button class="fs-btn" onclick="setFs(\''+s+'\')" style="background:'+(on?'var(--acc)':'rgba(10,132,255,.12)')+';color:'+(on?'#fff':'var(--acc)')+';font-size:'+FS[s]+'">'+lbl+'</button>';
  }).join('');
  var sessBtns=SO.map(function(s,i){
    var sess=ST.prog[s],on=i===ST.si;
    return'<button onclick="setSess('+i+')" style="flex:1;padding:8px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:inherit;font-family:inherit;background:'+(on?sess.color+'44':'rgba(255,255,255,.07)')+';color:'+(on?sess.color:'var(--txt3)')+'">'+sess.icon+' '+sess.name+'</button>';
  }).join('');
  document.getElementById('settings-body').innerHTML=
    '<div class="sett-sec"><div class="sett-title">Εμφάνιση</div><div class="sett-card"><div style="padding:14px 16px"><div style="font-weight:600;margin-bottom:10px">Μέγεθος γραμματοσειράς</div><div class="fs-pick">'+fsBtns+'</div></div></div></div>'+
    '<div class="sett-sec"><div class="sett-title">Κύκλος Προπόνησης</div><div class="sett-card">'+
      '<div style="padding:13px 16px;border-bottom:1px solid var(--sep)"><div style="font-weight:600;margin-bottom:10px">Εβδομάδα κύκλου</div>'+
        '<div style="display:flex;align-items:center;gap:16px">'+
          '<button class="btn btn-ghost" style="width:36px;height:36px;padding:0;border-radius:50%;font-size:1.3em" onclick="adjW(-1)" '+(ST.cw<=1?'disabled':'')+'>−</button>'+
          '<div style="flex:1">'+bdg(WK[ST.cw-1].l,WK[ST.cw-1].c)+'</div>'+
          '<button class="btn btn-ghost" style="width:36px;height:36px;padding:0;border-radius:50%;font-size:1.3em" onclick="adjW(1)" '+(ST.cw>=4?'disabled':'')+'>+</button>'+
        '</div>'+
      '</div>'+
      '<div style="padding:13px 16px;border-bottom:1px solid var(--sep)"><div style="font-weight:600;margin-bottom:10px">Τρέχον Session</div><div style="display:flex;gap:8px">'+sessBtns+'</div></div>'+
      '<div style="display:flex;align-items:center;padding:13px 16px"><div style="flex:1">Συνολικές προπονήσεις</div><div style="font-weight:700;color:var(--acc)">'+ST.total+'</div></div>'+
    '</div></div>'+
    '<div class="sett-sec"><div class="sett-title">Αποθήκευση & Μεταφορά</div>'+
      '<div style="background:rgba(10,132,255,.08);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:.88em;color:var(--tel)">'+
        '💾 Αποθηκεύεται τοπικά σε <b>'+esc(STORAGE_MODE)+'</b> στον browser αυτής της συσκευής.<br>'+
        'Το IndexedDB είναι πιο κατάλληλο από localStorage για μεγαλύτερο δομημένο ιστορικό. Για άλλη συσκευή χρησιμοποίησε εξαγωγή/εισαγωγή JSON ή clipboard.'+
      '</div>'+
      '<div class="sett-card">'+
        '<div class="sett-row" onclick="exportData()"><div style="flex:1">📤 Εξαγωγή αρχείου JSON</div><div style="color:var(--txt3)">›</div></div>'+
        '<div class="sett-row" onclick="document.getElementById(\'file-in\').click()"><div style="flex:1">📥 Εισαγωγή από αρχείο JSON</div><div style="color:var(--txt3)">›</div></div>'+
        '<div class="sett-row" onclick="copyBackup()"><div style="flex:1">📋 Αντιγραφή backup (clipboard)</div><div style="color:var(--txt3)">›</div></div>'+
        '<div class="sett-row" onclick="pasteBackup()"><div style="flex:1">📋 Επαναφορά από clipboard</div><div style="color:var(--txt3)">›</div></div>'+
        '<div class="sett-row" style="border-top:1px solid var(--sep)" onclick="resetProg()"><div style="flex:1;color:var(--org)">🔄 Επαναφορά προγράμματος</div><div style="color:var(--txt3)">›</div></div>'+
        '<div class="sett-row" onclick="resetAll()"><div style="flex:1;color:var(--red)">⚠️ Διαγραφή όλων</div><div style="color:var(--txt3)">›</div></div>'+
      '</div>'+
    '</div>'+
    '<div style="text-align:center;padding:6px 20px 20px;color:var(--txt3);font-size:.82em">PPL Tracker · v6.0 · IndexedDB</div>';
}
function setFs(s){ST.fs=s;saveST();applyFs();renderSettings()}
function adjW(d){ST.cw=Math.max(1,Math.min(4,ST.cw+d));saveST();renderSettings()}
function setSess(i){ST.si=i;saveST();renderSettings()}
function exportData(){
  var blob=new Blob([JSON.stringify(ST,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='ppl-backup.json';a.click();
  showToast('Εξαγωγή ολοκληρώθηκε');
}
function doImport(txt){
  try{
    var d=JSON.parse(txt);if(!d.logs)throw 1;
    if(d.logs)ST.logs=d.logs;
    if(d.prog)ST.prog=d.prog;
    if(d.cw)ST.cw=d.cw;
    if(d.si!==undefined)ST.si=d.si;
    if(d.total)ST.total=d.total;
    if(d.fs)ST.fs=d.fs;
    saveST();applyFs();
    showToast('Εισαγωγή ολοκληρώθηκε ✓');
    renderSettings();renderHome();
  }catch(e){showToast('Σφάλμα — μη έγκυρο αρχείο','rgba(255,69,58,.92)')}
}
function copyBackup(){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(JSON.stringify(ST)).then(function(){showToast('Αντιγράφηκε! Κάνε paste στην άλλη συσκευή')});
  }else{showToast('Δεν υποστηρίζεται — χρήσιμοποίησε εξαγωγή αρχείου','rgba(255,159,10,.92)')}
}
function pasteBackup(){
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(txt){doImport(txt)});
  }else{showToast('Δεν υποστηρίζεται — χρήσιμοποίησε εισαγωγή αρχείου','rgba(255,159,10,.92)')}
}
function resetProg(){
  showModal('Επαναφορά;','Το ιστορικό δεν χάνεται.',[
    {l:'Επαναφορά',red:true,fn:function(){ST.prog=JSON.parse(JSON.stringify(DEF));saveST();renderProg();showToast('Επαναφέρθηκε')}}
  ]);
}
function resetAll(){
  showModal('⚠️ Διαγραφή ΟΛΩΝ','Θα διαγραφούν ΟΛΑ. Δεν αναστρέφεται.',[
    {l:'Διαγραφή όλων',red:true,fn:function(){ST=defState();saveST();applyFs();goTo('home');showToast('Διαγράφηκαν')}}
  ]);
}
document.getElementById('file-in').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(ev){doImport(ev.target.result)};r.readAsText(f);
  this.value='';
};

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
loadST().then(function(st){
  ST=st;
  applyFs();
  requestPersistentStorage();
  renderHome();
  setProgTab('push');
  renderHistTabs();
  // If workout was in progress (e.g. after page refresh), restore it
  if(ST.active){buildWorkoutDOM()}
}).catch(function(){
  ST=defState();
  applyFs();
  renderHome();
  setProgTab('push');
  renderHistTabs();
});
</script>
