<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL Tracker">
<title>PPL Tracker</title>
<style>
:root {
  --bg: #000; --bg2: #1c1c1e; --bg3: #2c2c2e; --bg4: #3a3a3c;
  --txt: #fff; --txt2: #ebebf5cc; --txt3: #ebebf599;
  --sep: #38383a; --acc: #0a84ff; --red: #ff453a; --green: #30d158;
  --orange: #ff9f0a; --purple: #bf5af2; --teal: #5ac8fa;
  --card: #1c1c1e; --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--txt); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; overflow: hidden; }
#app { height: 100vh; display: flex; flex-direction: column; }
.screen { display: none; flex: 1; overflow-y: auto; padding-bottom: calc(70px + var(--safe)); }
.screen.active { display: block; }

/* NAV */
#nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28,28,30,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--sep); display: flex; padding-bottom: var(--safe); z-index: 100; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0 10px; border: none; background: none; color: var(--txt3); font-size: 10px; gap: 3px; cursor: pointer; }
.nav-btn.active { color: var(--acc); }
.nav-btn svg { width: 24px; height: 24px; }

/* HEADER */
.page-header { padding: 56px 20px 12px; }
.page-title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
.page-sub { font-size: 15px; color: var(--txt3); margin-top: 4px; }

/* CARDS */
.card { background: var(--card); border-radius: 16px; margin: 0 16px 12px; overflow: hidden; }
.card-header { padding: 14px 16px 10px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: 0.5px; }
.card-row { display: flex; align-items: center; padding: 12px 16px; border-top: 1px solid var(--sep); }
.card-row:first-child { border-top: none; }
.card-row-label { flex: 1; font-size: 16px; }
.card-row-val { font-size: 16px; color: var(--txt3); }

/* WORKOUT HOME */
.next-workout { margin: 16px; background: linear-gradient(135deg, #1a3a5c, #0d2137); border-radius: 20px; padding: 20px; }
.nw-label { font-size: 12px; font-weight: 600; color: var(--teal); text-transform: uppercase; letter-spacing: 1px; }
.nw-title { font-size: 26px; font-weight: 700; margin: 6px 0 4px; }
.nw-sub { font-size: 14px; color: var(--txt2); margin-bottom: 16px; }
.nw-meta { display: flex; gap: 12px; margin-bottom: 18px; }
.nw-chip { background: rgba(255,255,255,0.12); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
.btn-start { width: 100%; background: var(--acc); color: #fff; border: none; border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 600; cursor: pointer; }
.btn-start:active { opacity: 0.85; }

.week-indicator { margin: 0 16px 12px; display: flex; gap: 8px; }
.week-dot { flex: 1; height: 6px; border-radius: 3px; background: var(--bg3); }
.week-dot.done { background: var(--green); }
.week-dot.current { background: var(--acc); }

/* ACTIVE WORKOUT */
#workout-screen { background: var(--bg); }
.workout-header { background: var(--bg2); padding: 54px 20px 16px; position: sticky; top: 0; z-index: 10; }
.wh-row { display: flex; align-items: center; justify-content: space-between; }
.wh-title { font-size: 20px; font-weight: 700; }
.wh-week { font-size: 13px; color: var(--txt3); }
.wh-close { width: 32px; height: 32px; background: var(--bg3); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; color: var(--txt); font-size: 18px; }

.ex-card { margin: 12px 16px; background: var(--card); border-radius: 16px; overflow: hidden; }
.ex-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.ex-name { font-size: 16px; font-weight: 600; }
.ex-presc { font-size: 13px; color: var(--txt3); margin-top: 2px; }
.ex-status { display: flex; align-items: center; gap: 8px; }
.ex-done-badge { background: var(--green); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
.ex-expand { color: var(--txt3); font-size: 20px; transition: transform 0.2s; }
.ex-expand.open { transform: rotate(180deg); }

.ex-body { display: none; border-top: 1px solid var(--sep); }
.ex-body.open { display: block; }
.ex-tip { padding: 10px 16px; background: rgba(10,132,255,0.08); font-size: 13px; color: var(--teal); border-bottom: 1px solid var(--sep); }

.set-row { display: flex; align-items: center; padding: 10px 16px; gap: 10px; border-bottom: 1px solid var(--sep); }
.set-row:last-child { border-bottom: none; }
.set-num { width: 28px; height: 28px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--txt3); flex-shrink: 0; }
.set-num.done { background: var(--green); color: #fff; }
.set-inputs { display: flex; gap: 8px; flex: 1; }
.set-input-group { flex: 1; }
.set-input-label { font-size: 10px; color: var(--txt3); text-transform: uppercase; margin-bottom: 2px; }
.set-input { width: 100%; background: var(--bg3); border: none; border-radius: 8px; padding: 8px 10px; color: var(--txt); font-size: 15px; font-weight: 600; text-align: center; }
.set-input:focus { outline: none; background: var(--bg4); }
.set-check { width: 36px; height: 36px; border-radius: 50%; background: var(--bg3); border: 2px solid var(--bg4); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 16px; }
.set-check.done { background: var(--green); border-color: var(--green); }
.prev-best { padding: 6px 16px 8px; font-size: 12px; color: var(--txt3); }

.btn-finish-workout { margin: 16px; background: var(--green); color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 700; cursor: pointer; width: calc(100% - 32px); display: block; }
.btn-finish-workout:active { opacity: 0.85; }
.btn-finish-workout:disabled { background: var(--bg3); color: var(--txt3); }

/* TIMER */
#timer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
#timer-overlay.active { display: flex; }
.timer-circle { width: 220px; height: 220px; position: relative; margin-bottom: 20px; }
.timer-svg { transform: rotate(-90deg); }
.timer-track { fill: none; stroke: var(--bg3); stroke-width: 8; }
.timer-prog { fill: none; stroke: var(--acc); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.timer-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.timer-num { font-size: 54px; font-weight: 200; letter-spacing: -2px; }
.timer-label { font-size: 14px; color: var(--txt3); }
.timer-btns { display: flex; gap: 16px; }
.timer-btn { padding: 12px 28px; border-radius: 30px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
.timer-btn.skip { background: var(--bg3); color: var(--txt); }
.timer-btn.plus { background: var(--bg3); color: var(--acc); }
.timer-next-ex { font-size: 14px; color: var(--txt3); margin-bottom: 24px; text-align: center; }

/* HISTORY */
.hist-item { margin: 0 16px 10px; background: var(--card); border-radius: 16px; overflow: hidden; }
.hist-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; }
.hist-date { font-size: 15px; font-weight: 700; }
.hist-name { font-size: 13px; color: var(--txt3); margin-top: 2px; }
.hist-stats { display: flex; gap: 12px; }
.hist-stat { text-align: right; }
.hist-stat-val { font-size: 16px; font-weight: 700; color: var(--acc); }
.hist-stat-label { font-size: 11px; color: var(--txt3); }
.hist-detail { display: none; border-top: 1px solid var(--sep); padding: 12px 16px; }
.hist-detail.open { display: block; }
.hist-ex-row { font-size: 14px; color: var(--txt2); padding: 3px 0; }

/* PROGRAM EDITOR */
.prog-session { margin: 0 16px 16px; }
.prog-session-title { font-size: 13px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 4px 8px; }
.prog-ex-item { background: var(--card); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.prog-ex-main { display: flex; align-items: center; padding: 12px 14px; cursor: pointer; }
.prog-ex-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 12px; flex-shrink: 0; }
.prog-ex-info { flex: 1; }
.prog-ex-name { font-size: 15px; font-weight: 600; }
.prog-ex-desc { font-size: 13px; color: var(--txt3); margin-top: 1px; }
.prog-ex-arrow { color: var(--txt3); font-size: 18px; }
.prog-ex-edit { display: none; border-top: 1px solid var(--sep); padding: 14px; }
.prog-ex-edit.open { display: block; }
.edit-field { margin-bottom: 12px; }
.edit-label { font-size: 12px; color: var(--txt3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.edit-input { width: 100%; background: var(--bg3); border: none; border-radius: 10px; padding: 10px 12px; color: var(--txt); font-size: 15px; }
.edit-input:focus { outline: none; background: var(--bg4); }
.edit-textarea { width: 100%; background: var(--bg3); border: none; border-radius: 10px; padding: 10px 12px; color: var(--txt); font-size: 14px; resize: none; height: 70px; }
.edit-textarea:focus { outline: none; background: var(--bg4); }
.edit-row { display: flex; gap: 10px; }
.edit-row .edit-field { flex: 1; }
.btn-save { background: var(--acc); color: #fff; border: none; border-radius: 10px; padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-del { background: rgba(255,69,58,0.15); color: var(--red); border: none; border-radius: 10px; padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-add-ex { width: calc(100% - 32px); margin: 0 16px 12px; background: rgba(10,132,255,0.1); color: var(--acc); border: 2px dashed rgba(10,132,255,0.3); border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; }

/* SETTINGS */
.settings-section { margin: 0 16px 20px; }
.settings-title { font-size: 13px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 4px 8px; }
.settings-card { background: var(--card); border-radius: 16px; overflow: hidden; }
.settings-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--sep); cursor: pointer; }
.settings-row:last-child { border-bottom: none; }
.settings-row-label { flex: 1; font-size: 16px; }
.settings-row-val { font-size: 15px; color: var(--txt3); margin-right: 6px; }
.settings-arrow { color: var(--bg4); font-size: 18px; }
select.settings-sel { background: transparent; border: none; color: var(--acc); font-size: 15px; font-weight: 600; appearance: none; cursor: pointer; }

/* MODAL */
#modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: flex-end; }
#modal.active { display: flex; }
.modal-sheet { background: var(--bg2); border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + var(--safe)); width: 100%; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }
.modal-btn { width: 100%; background: var(--bg3); border: none; border-radius: 12px; padding: 14px; font-size: 16px; color: var(--txt); cursor: pointer; margin-bottom: 10px; font-weight: 500; }
.modal-btn.danger { color: var(--red); }
.modal-btn.primary { background: var(--acc); color: #fff; font-weight: 600; }
.modal-cancel { width: 100%; background: var(--bg3); border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; color: var(--txt); cursor: pointer; margin-top: 6px; }

/* MISC */
.empty-state { text-align: center; padding: 60px 30px; color: var(--txt3); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-txt { font-size: 17px; font-weight: 600; color: var(--txt2); margin-bottom: 6px; }
.empty-sub { font-size: 14px; }
.badge-week { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.badge-str  { background: rgba(255,69,58,0.2);   color: var(--red); }
.badge-hyp  { background: rgba(48,209,88,0.2);   color: var(--green); }
.badge-sp   { background: rgba(191,90,242,0.2);  color: var(--purple); }
.badge-del  { background: rgba(90,200,250,0.2);  color: var(--teal); }

.progress-ring { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.ring-seg { flex: 1; height: 4px; border-radius: 2px; background: var(--bg3); }
.ring-seg.done { background: var(--green); }
.ring-seg.active { background: var(--acc); }

.toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(48,209,88,0.9); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; z-index: 500; display: none; }
.toast.show { display: block; animation: fadeInOut 2s forwards; }
@keyframes fadeInOut { 0%{opacity:0;transform:translateX(-50%) translateY(-10px)} 15%{opacity:1;transform:translateX(-50%) translateY(0)} 75%{opacity:1} 100%{opacity:0} }
</style>
</head>
<body>
<div id="app">
  <!-- HOME -->
  <div id="home-screen" class="screen active">
    <div class="page-header"><div class="page-title">Γεια σου 👋</div><div class="page-sub" id="home-date"></div></div>
    <div id="home-content"></div>
  </div>
  <!-- WORKOUT -->
  <div id="workout-screen" class="screen">
    <div class="workout-header">
      <div class="wh-row">
        <div>
          <div class="wh-title" id="wh-title"></div>
          <div class="wh-week" id="wh-week"></div>
        </div>
        <button class="wh-close" onclick="closeWorkout()">✕</button>
      </div>
    </div>
    <div id="workout-body"></div>
  </div>
  <!-- HISTORY -->
  <div id="history-screen" class="screen">
    <div class="page-header"><div class="page-title">Ιστορικό</div><div class="page-sub" id="hist-sub"></div></div>
    <div id="history-list"></div>
  </div>
  <!-- PROGRAM -->
  <div id="program-screen" class="screen">
    <div class="page-header"><div class="page-title">Πρόγραμμα</div><div class="page-sub">Επεξεργασία ασκήσεων</div></div>
    <div id="program-tabs" style="display:flex;gap:8px;padding:0 16px 12px">
      <button class="prog-tab-btn active" onclick="showProgTab('push')" id="ptab-push" style="flex:1;background:rgba(255,69,58,0.2);color:var(--red);border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer">PUSH</button>
      <button class="prog-tab-btn" onclick="showProgTab('pull')" id="ptab-pull" style="flex:1;background:var(--bg3);color:var(--txt3);border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer">PULL</button>
      <button class="prog-tab-btn" onclick="showProgTab('legs')" id="ptab-legs" style="flex:1;background:var(--bg3);color:var(--txt3);border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer">LEGS</button>
    </div>
    <div id="program-body"></div>
  </div>
  <!-- SETTINGS -->
  <div id="settings-screen" class="screen">
    <div class="page-header"><div class="page-title">Ρυθμίσεις</div></div>
    <div id="settings-body"></div>
  </div>
  <!-- NAV -->
  <div id="nav">
    <button class="nav-btn active" onclick="showScreen('home')" id="nav-home">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Σήμερα</span>
    </button>
    <button class="nav-btn" onclick="showScreen('workout-start')" id="nav-workout">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>
      <span>Προπόνηση</span>
    </button>
    <button class="nav-btn" onclick="showScreen('history')" id="nav-history">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <span>Ιστορικό</span>
    </button>
    <button class="nav-btn" onclick="showScreen('program')" id="nav-program">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      <span>Πρόγραμμα</span>
    </button>
    <button class="nav-btn" onclick="showScreen('settings')" id="nav-settings">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
      <span>Ρυθμίσεις</span>
    </button>
  </div>
</div>

<!-- TIMER OVERLAY -->
<div id="timer-overlay">
  <div class="timer-next-ex" id="timer-next"></div>
  <div class="timer-circle">
    <svg class="timer-svg" width="220" height="220" viewBox="0 0 220 220">
      <circle class="timer-track" cx="110" cy="110" r="100"/>
      <circle class="timer-prog" id="timer-circle" cx="110" cy="110" r="100" stroke-dasharray="628" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-text">
      <div class="timer-num" id="timer-display">2:00</div>
      <div class="timer-label">ανάπαυση</div>
    </div>
  </div>
  <div class="timer-btns">
    <button class="timer-btn plus" onclick="addTimerTime(30)">+30\"</button>
    <button class="timer-btn skip" onclick="skipTimer()">Παράλειψη</button>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════
const DEFAULT_PROGRAM = {
  push: {
    name: 'PUSH', color: '#ff453a', icon: '💪',
    exercises: [

function loadState() {
  try {
    return JSON.parse(localStorage.getItem('pplState') || 'null') || {
      cycleWeek: 1, sessionIdx: 0, totalWorkouts: 0,
      program: DEFAULT_PROGRAM,
      logs: [],
      restTimes: { str: 210, hyp: 120, sp: 180, del: 90 },
      currentWorkout: null
    };
  } catch(e) { return { cycleWeek:1, sessionIdx:0, totalWorkouts:0, program:DEFAULT_PROGRAM, logs:[], restTimes:{str:210,hyp:120,sp:180,del:90}, currentWorkout:null }; }
}
function saveState() { localStorage.setItem('pplState', JSON.stringify(STATE)); }
let STATE = loadState();

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function getSetsKey(w) { return ['sets_w1','sets_w2','sets_w3','sets_w4'][w-1]; }
function getRestKey(w) { return ['rest_w1','rest_w2','rest_w3','rest_w4'][w-1]; }
function parseSetCount(setsStr) {
  if (!setsStr || setsStr === '—') return 0;
  const m = setsStr.match(/^(\d+)/);
  return m ? parseInt(m[1]) : 3;
}
function formatDate(iso) {
  const d = new Date(iso);
  const days = ['Κυρ','Δευ','Τρί','Τετ','Πέμ','Παρ','Σαβ'];
  const months = ['Ιαν','Φεβ','Μαρ','Απρ','Μαΐ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2200);
}
function getBestForExercise(exId) {
  for (let i = STATE.logs.length - 1; i >= 0; i--) {
    const log = STATE.logs[i];
    const ex = log.exercises.find(e => e.id === exId);
    if (ex && ex.sets.length) {
      const best = ex.sets.reduce((b,s) => (s.weight > b.weight ? s : b), ex.sets[0]);
      if (best.weight > 0) return `Καλύτερο: ${best.weight}kg × ${best.reps}`;
    }
  }
  return null;
}

let currentScreen = 'home';
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (name === 'workout-start') {
    startWorkout();
    return;
  }
  const scr = document.getElementById(name + '-screen');
  if (scr) scr.classList.add('active');
  const nav = document.getElementById('nav-' + name);
  if (nav) nav.classList.add('active');
  currentScreen = name;
  if (name === 'home') renderHome();
  if (name === 'history') renderHistory();
  if (name === 'program') renderProgram();
  if (name === 'settings') renderSettings();
}

// ══════════════════════════════════════════════════════
// WORKOUT
// ══════════════════════════════════════════════════════
let activeWorkout = null;

function startWorkout() {
  const w = STATE.cycleWeek;
  const si = STATE.sessionIdx;
  const sessionKey = SESSION_ORDER[si];
  const sess = STATE.program[sessionKey];
  const wk = getSetsKey(w);

  activeWorkout = {
    id: Date.now(),
    date: new Date().toISOString(),
    sessionKey, sessionName: sess.name,
    cycleWeek: w,
    exercises: sess.exercises
      .filter(ex => ex[wk] && ex[wk] !== '—')
      .map(ex => {
        const sc = parseSetCount(ex[wk]);
        return {
          id: ex.id, name: ex.name,
          prescription: ex[wk],
          restSecs: ex[getRestKey(w)] || 120,
          tip: ex.tip,
          sets: Array.from({length:sc}, () => ({weight:'', reps:'', done:false})),
          open: false
        };
      })
  };

  document.getElementById('wh-title').textContent = `${sess.icon} ${sess.name}`;
  document.getElementById('wh-week').textContent = WEEK_INFO[w-1].label;
  renderWorkoutBody();
  showScreen('workout');
  document.getElementById('nav-workout').classList.add('active');
}

function renderWorkoutBody() {
  const done = activeWorkout.exercises.every(ex => ex.sets.every(s => s.done));
  let html = '';
  activeWorkout.exercises.forEach((ex, ei) => {
    const allDone = ex.sets.every(s => s.done);
    const best = getBestForExercise(ex.id);
    let setsHTML = '';
    ex.sets.forEach((set, si) => {
      setsHTML += `
        <div class="set-row">
          <div class="set-num ${set.done?'done':''}">${si+1}</div>
          <div class="set-inputs">
            <div class="set-input-group">
              <div class="set-input-label">kg</div>
              <input class="set-input" type="number" inputmode="decimal" value="${set.weight}" placeholder="0"
                onchange="setWeight(${ei},${si},this.value)" onfocus="this.select()">
            </div>
            <div class="set-input-group">
              <div class="set-input-label">reps</div>
              <input class="set-input" type="number" inputmode="numeric" value="${set.reps}" placeholder="0"
                onchange="setReps(${ei},${si},this.value)" onfocus="this.select()">
            </div>
          </div>
          <div class="set-check ${set.done?'done':''}" onclick="toggleSet(${ei},${si})">
            ${set.done ? '✓' : ''}
          </div>
        </div>`;
    });
    html += `
      <div class="ex-card">
        <div class="ex-header" onclick="toggleExercise(${ei})">
          <div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-presc">${ex.prescription}</div>
          </div>
          <div class="ex-status">
            ${allDone ? '<span class="ex-done-badge">✓ Έγινε</span>' : ''}
            <span class="ex-expand ${ex.open?'open':''}">⌄</span>
          </div>
        </div>
        <div class="ex-body ${ex.open?'open':''}">
          ${ex.tip ? `<div class="ex-tip">💡 ${ex.tip}</div>` : ''}
          ${best ? `<div class="prev-best">📈 ${best}</div>` : ''}
          ${setsHTML}
        </div>
      </div>`;
  });

  html += `<button class="btn-finish-workout" onclick="finishWorkout()" ${done?'':'style="background:var(--bg3);color:var(--txt3);"'}>
    ${done ? '🎉 Ολοκλήρωσε Προπόνηση' : 'Ολοκλήρωσε (σημείωσε όλα τα sets)'}
  </button><div style="height:20px"></div>`;

  document.getElementById('workout-body').innerHTML = html;
  document.getElementById('workout-screen').classList.add('active');
  document.querySelectorAll('.screen').forEach(s => { if(s.id !== 'workout-screen') s.classList.remove('active'); });
}

function toggleExercise(ei) {
  activeWorkout.exercises[ei].open = !activeWorkout.exercises[ei].open;
  renderWorkoutBody();
}
function setWeight(ei, si, val) { activeWorkout.exercises[ei].sets[si].weight = parseFloat(val)||0; }
function setReps(ei, si, val)   { activeWorkout.exercises[ei].sets[si].reps   = parseInt(val)||0; }

function toggleSet(ei, si) {
  const set = activeWorkout.exercises[ei].sets[si];
  set.done = !set.done;
  if (set.done) {
    const ex = activeWorkout.exercises[ei];
    const restSecs = ex.restSecs || 120;
    // Find next set or exercise
    let nextLabel = '';
    const nextSet = ex.sets[si+1];
    if (nextSet) nextLabel = `Επόμενο set: ${ex.name}`;
    else {
      const nextEx = activeWorkout.exercises[ei+1];
      if (nextEx) nextLabel = `Επόμενη: ${nextEx.name}`;
      else nextLabel = 'Τελευταίο set! 🎉';
    }
    startTimer(restSecs, nextLabel);
  }
  renderWorkoutBody();
}

function finishWorkout() {
  const allDone = activeWorkout.exercises.every(ex => ex.sets.every(s => s.done));
  if (!allDone) {
    showModal('Ολοκλήρωση;', 'Δεν έχεις σημειώσει όλα τα sets. Θες να αποθηκεύσεις ούτως ή άλλως;',
      [{ label:'Αποθήκευση', action:'saveWorkout()', style:'primary' },
       { label:'Άκυρο', action:'closeModal()', style:'' }]);
    return;
  }
  saveWorkout();
}

function saveWorkout() {
  closeModal();
  STATE.logs.push({ ...activeWorkout, exercises: activeWorkout.exercises.map(e => ({...e, sets:[...e.sets]})) });
  STATE.totalWorkouts++;
  // Advance
  STATE.sessionIdx++;
  if (STATE.sessionIdx >= SESSION_ORDER.length) {
    STATE.sessionIdx = 0;
    STATE.cycleWeek++;
    if (STATE.cycleWeek > 4) STATE.cycleWeek = 1;
  }
  saveState();
  activeWorkout = null;
  stopTimer();
  showToast('Προπόνηση αποθηκεύτηκε! 🎉');
  showScreen('home');
}

function closeWorkout() {
  showModal('Κλείσιμο προπόνησης', 'Η πρόοδός σου θα χαθεί.',
    [{ label:'Κλείσιμο χωρίς αποθήκευση', action:'discardWorkout()', style:'danger' },
     { label:'Αποθήκευση & Κλείσιμο', action:'saveWorkout()', style:'primary' },
     { label:'Συνέχεια', action:'closeModal()', style:'' }]);
}
function discardWorkout() {
  closeModal();
  activeWorkout = null;
  stopTimer();
  showScreen('home');
}

// ══════════════════════════════════════════════════════
// TIMER
// ══════════════════════════════════════════════════════
let timerInterval = null;
let timerTotal = 0;
let timerLeft = 0;

function startTimer(secs, nextLabel) {
  stopTimer();
  timerTotal = secs;
  timerLeft = secs;
  document.getElementById('timer-next').textContent = nextLabel;
  document.getElementById('timer-overlay').classList.add('active');
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerLeft--;
    if (timerLeft <= 0) { stopTimer(); return; }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timerLeft/60);
  const s = timerLeft % 60;
  document.getElementById('timer-display').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const circ = 2 * Math.PI * 100;
  const offset = circ * (timerLeft / timerTotal);
  document.getElementById('timer-circle').style.strokeDashoffset = circ - offset;
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  document.getElementById('timer-overlay').classList.remove('active');
}
function skipTimer() { stopTimer(); }
function addTimerTime(secs) {
  timerLeft += secs;
  timerTotal += secs;
  updateTimerDisplay();
}

        <div class="empty-icon">📋</div>
        <div class="empty-txt">Καμία καταγραφή ακόμα</div>
        <div class="empty-sub">Ξεκίνα την πρώτη σου προπόνηση!</div>
      </div>`;
    return;
  }
  let html = '';
  logs.forEach(log => {
    const totalSets = log.exercises.reduce((s,e) => s + e.sets.filter(st=>st.done).length, 0);
    const totalVol  = log.exercises.reduce((s,e) => s + e.sets.reduce((ss,st) => ss+(st.weight*st.reps||0),0), 0);
    const wi = WEEK_INFO[log.cycleWeek-1];
    let detailHTML = log.exercises.map(ex => {
      const doneSets = ex.sets.filter(s=>s.done);
      if (!doneSets.length) return '';
      const best = doneSets.reduce((b,s) => s.weight>b.weight?s:b, doneSets[0]);
      return `<div class="hist-ex-row"><b>${ex.name}</b>: ${doneSets.length} sets${best.weight>0?' · best '+best.weight+'kg×'+best.reps:''}</div>`;
    }).join('');
    html += `
      <div class="hist-item">
        <div class="hist-header" onclick="toggleHistItem('h${log.id}')">
          <div>
            <div class="hist-date">${formatDate(log.date)} — ${log.sessionName}</div>
            <div class="hist-name"><span class="badge-week ${wi.badge}" style="font-size:11px">${wi.label}</span></div>
          </div>
          <div class="hist-stats">
            <div class="hist-stat">
              <div class="hist-stat-val">${totalSets}</div>
              <div class="hist-stat-label">sets</div>
            </div>
            ${totalVol>0?`<div class="hist-stat"><div class="hist-stat-val">${(totalVol/1000).toFixed(1)}t</div><div class="hist-stat-label">όγκος</div></div>`:''}
          </div>
        </div>
        <div class="hist-detail" id="h${log.id}">${detailHTML}</div>
      </div>`;
  });
  document.getElementById('history-list').innerHTML = html + '<div style="height:10px"></div>';
}

function toggleHistItem(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// ══════════════════════════════════════════════════════
// PROGRAM EDITOR
// ══════════════════════════════════════════════════════
let currentProgTab = 'push';

function showProgTab(tab) {
  currentProgTab = tab;
  ['push','pull','legs'].forEach(t => {
    const btn = document.getElementById('ptab-'+t);
    const sess = STATE.program[t];
    if (t === tab) {
      btn.style.background = sess.color + '33';
      btn.style.color = sess.color;
    } else {
      btn.style.background = 'var(--bg3)';
      btn.style.color = 'var(--txt3)';
    }
  });
  renderProgram();
}

function renderProgram() {
  const tab = currentProgTab;
  const sess = STATE.program[tab];
  let html = '';
  sess.exercises.forEach((ex, i) => {
    html += `
      <div class="prog-ex-item">
        <div class="prog-ex-main" onclick="toggleProgEx(${i})">
          <div class="prog-ex-icon" style="background:${sess.color}22">${sess.icon}</div>
          <div class="prog-ex-info">
            <div class="prog-ex-name">${ex.name}</div>
            <div class="prog-ex-desc">${ex.sets_w1} | ${ex.sets_w2} | ${ex.sets_w3} | ${ex.sets_w4}</div>
          </div>
          <div class="prog-ex-arrow">›</div>
        </div>
        <div class="prog-ex-edit" id="pex-${tab}-${i}">
          <div class="edit-field">
            <div class="edit-label">Όνομα Άσκησης</div>
            <input class="edit-input" id="en-${tab}-${i}" value="${ex.name}">
          </div>
          <div class="edit-row">
            <div class="edit-field">
              <div class="edit-label">Sets Εβδ.1 (Δύναμη)</div>
              <input class="edit-input" id="ew1-${tab}-${i}" value="${ex.sets_w1}">
            </div>
            <div class="edit-field">
              <div class="edit-label">Ανάπαυση (δευτ.)</div>
              <input class="edit-input" type="number" id="er1-${tab}-${i}" value="${ex.rest_w1}">
            </div>
          </div>
          <div class="edit-row">
            <div class="edit-field">
              <div class="edit-label">Sets Εβδ.2 (Υπερτρ.)</div>
              <input class="edit-input" id="ew2-${tab}-${i}" value="${ex.sets_w2}">
            </div>
            <div class="edit-field">
              <div class="edit-label">Ανάπαυση (δευτ.)</div>
              <input class="edit-input" type="number" id="er2-${tab}-${i}" value="${ex.rest_w2}">
            </div>
          </div>
          <div class="edit-row">
            <div class="edit-field">
              <div class="edit-label">Sets Εβδ.3 (Δύναμη+)</div>
              <input class="edit-input" id="ew3-${tab}-${i}" value="${ex.sets_w3}">
            </div>
            <div class="edit-field">
              <div class="edit-label">Ανάπαυση (δευτ.)</div>
              <input class="edit-input" type="number" id="er3-${tab}-${i}" value="${ex.rest_w3}">
            </div>
          </div>
          <div class="edit-row">
            <div class="edit-field">
              <div class="edit-label">Sets Εβδ.4 (Αποφόρτ.)</div>
              <input class="edit-input" id="ew4-${tab}-${i}" value="${ex.sets_w4}">
            </div>
            <div class="edit-field">
              <div class="edit-label">Ανάπαυση (δευτ.)</div>
              <input class="edit-input" type="number" id="er4-${tab}-${i}" value="${ex.rest_w4}">
            </div>
          </div>
          <div class="edit-field">
            <div class="edit-label">Tip / Οδηγίες</div>
            <textarea class="edit-textarea" id="et-${tab}-${i}">${ex.tip||''}</textarea>
          </div>
          <div style="display:flex;gap:10px">
            <button class="btn-save" onclick="saveExercise('${tab}',${i})">Αποθήκευση</button>
            <button class="btn-del" onclick="deleteExercise('${tab}',${i})">Διαγραφή</button>
          </div>
        </div>
      </div>`;
  });
  html += `<button class="btn-add-ex" onclick="addExercise('${tab}')">+ Νέα Άσκηση</button>`;
  html += '<div style="height:10px"></div>';
  document.getElementById('program-body').innerHTML = html;
}

function toggleProgEx(i) {
  const el = document.getElementById(`pex-${currentProgTab}-${i}`);
  if (el) el.classList.toggle('open');
}

function saveExercise(tab, i) {
  const ex = STATE.program[tab].exercises[i];
  ex.name     = document.getElementById(`en-${tab}-${i}`).value;
  ex.sets_w1  = document.getElementById(`ew1-${tab}-${i}`).value;
  ex.sets_w2  = document.getElementById(`ew2-${tab}-${i}`).value;
  ex.sets_w3  = document.getElementById(`ew3-${tab}-${i}`).value;
  ex.sets_w4  = document.getElementById(`ew4-${tab}-${i}`).value;
  ex.rest_w1  = parseInt(document.getElementById(`er1-${tab}-${i}`).value)||120;
  ex.rest_w2  = parseInt(document.getElementById(`er2-${tab}-${i}`).value)||90;
  ex.rest_w3  = parseInt(document.getElementById(`er3-${tab}-${i}`).value)||120;
  ex.rest_w4  = parseInt(document.getElementById(`er4-${tab}-${i}`).value)||60;
  ex.tip      = document.getElementById(`et-${tab}-${i}`).value;
  saveState();
  showToast('Αποθηκεύτηκε ✓');
  renderProgram();
}

function deleteExercise(tab, i) {
  showModal('Διαγραφή άσκησης', `Θες να διαγράψεις "${STATE.program[tab].exercises[i].name}";`,
    [{ label:'Διαγραφή', action:`confirmDelete('${tab}',${i})`, style:'danger' },
     { label:'Άκυρο', action:'closeModal()', style:'' }]);
}
function confirmDelete(tab, i) {
  STATE.program[tab].exercises.splice(i, 1);
  saveState(); closeModal(); renderProgram();
  showToast('Διαγράφτηκε');
}

function addExercise(tab) {
  const newEx = {
    id: 'ex_' + Date.now(),
    name: 'Νέα Άσκηση',
    sets_w1:'3×5', sets_w2:'3×10', sets_w3:'3×6', sets_w4:'2×8',
    rest_w1:120, rest_w2:90, rest_w3:120, rest_w4:60,
    tip:''
  };
  STATE.program[tab].exercises.push(newEx);
  saveState();
  renderProgram();
  const last = STATE.program[tab].exercises.length - 1;
  setTimeout(() => {
    const el = document.getElementById(`pex-${tab}-${last}`);
    if (el) { el.classList.add('open'); el.scrollIntoView({behavior:'smooth'}); }
  }, 100);
}

// ══════════════════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════════════════
function renderSettings() {
  const w = STATE.cycleWeek;
  const si = STATE.sessionIdx;
  document.getElementById('settings-body').innerHTML = `
    <div class="settings-section">
      <div class="settings-title">Τρέχουσα θέση στον κύκλο</div>
      <div class="settings-card">
        <div class="settings-row">
          <div class="settings-row-label">Εβδομάδα κύκλου</div>
          <div style="display:flex;align-items:center;gap:8px">
            <button onclick="adjustWeek(-1)" style="background:var(--bg3);border:none;color:var(--acc);font-size:20px;width:32px;height:32px;border-radius:50%;cursor:pointer">−</button>
            <span style="font-size:16px;font-weight:700;min-width:20px;text-align:center">${w}</span>
            <button onclick="adjustWeek(1)" style="background:var(--bg3);border:none;color:var(--acc);font-size:20px;width:32px;height:32px;border-radius:50%;cursor:pointer">+</button>
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-row-label">Session</div>
          <div style="display:flex;gap:6px">
            ${SESSION_ORDER.map((s,i) => `<button onclick="setSessionIdx(${i})" style="padding:5px 10px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;background:${i===si?'var(--acc)':'var(--bg3)'};color:${i===si?'#fff':'var(--txt3)'}">${STATE.program[s].name}</button>`).join('')}
          </div>
        </div>
        <div class="settings-row" style="padding:10px 16px">
          <div style="font-size:13px;color:var(--txt3)">Προπονήσεις συνολικά: <b style="color:var(--acc)">${STATE.totalWorkouts}</b></div>
        </div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-title">Δεδομένα</div>
      <div class="settings-card">
        <div class="settings-row" onclick="exportData()">
          <div class="settings-row-label">📤 Εξαγωγή δεδομένων (JSON)</div>
          <div class="settings-arrow">›</div>
        </div>
        <div class="settings-row" onclick="resetProgram()">
          <div class="settings-row-label" style="color:var(--orange)">🔄 Επαναφορά προγράμματος</div>
          <div class="settings-arrow">›</div>
        </div>
        <div class="settings-row" onclick="resetAll()">
          <div class="settings-row-label" style="color:var(--red)">⚠️ Διαγραφή όλων</div>
          <div class="settings-arrow">›</div>
        </div>
      </div>
    </div>
    <div style="text-align:center;padding:20px;color:var(--txt3);font-size:13px">
      PPL Tracker · Intermediate 53y · v1.0
    </div>`;
}

function adjustWeek(d) {
  STATE.cycleWeek = Math.max(1, Math.min(4, STATE.cycleWeek + d));
  saveState(); renderSettings();
}
function setSessionIdx(i) {
  STATE.sessionIdx = i;
  saveState(); renderSettings();
}
function exportData() {
  const data = JSON.stringify(STATE, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ppl-backup.json'; a.click();
  showToast('Εξαγωγή ολοκληρώθηκε');
}
function resetProgram() {
  showModal('Επαναφορά;', 'Το πρόγραμμα θα επιστρέψει στις αρχικές ασκήσεις. Το ιστορικό δεν χάνεται.',
    [{ label:'Επαναφορά', action:'doResetProgram()', style:'danger' },
     { label:'Άκυρο', action:'closeModal()', style:'' }]);
}
function doResetProgram() {
  STATE.program = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
  saveState(); closeModal(); renderSettings(); showToast('Πρόγραμμα επαναφέρθηκε');
}
function resetAll() {
  showModal('⚠️ Διαγραφή ΟΛΩΝ', 'Θα διαγραφούν ΟΛΕΣ οι καταγραφές και το ιστορικό. Αυτό δεν αναστρέφεται.',
    [{ label:'Διαγραφή όλων', action:'doResetAll()', style:'danger' },
     { label:'Άκυρο', action:'closeModal()', style:'' }]);
}
function doResetAll() {
  localStorage.removeItem('pplState');
  STATE = loadState();
  closeModal(); renderSettings(); renderHome();
  showToast('Όλα διαγράφηκαν');
}

// ══════════════════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════════════════
function showModal(title, msg, buttons) {
  let html = `<div class="modal-title">${title}</div>`;
  if (msg) html += `<p style="text-align:center;color:var(--txt3);font-size:15px;margin-bottom:16px">${msg}</p>`;
  buttons.forEach(b => {
    html += `<button class="modal-btn ${b.style==='danger'?'danger':''} ${b.style==='primary'?'primary':''}" onclick="${b.action}">${b.label}</button>`;
  });
  html += `<button class="modal-cancel" onclick="closeModal()">Άκυρο</button>`;
  document.getElementById('modal-sheet').innerHTML = html;
  document.getElementById('modal').classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
renderHome();
</script>
</body>
